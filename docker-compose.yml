services:
  postgres:
    image: postgres:16-alpine
    container_name: customermates-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: ${APP_IMAGE:-customermates-crm:local}
    build:
      context: .
    container_name: customermates-app
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: self-hosted
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      BASE_URL: ${BASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_OPERATOR_EMAIL: ${RESEND_OPERATOR_EMAIL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      AUTOMATION_SCHEDULE_ENABLED: ${AUTOMATION_SCHEDULE_ENABLED:-false}
      WEBHOOK_ALLOW_PRIVATE_HOSTS: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB:-}
      MAILBOX_GOOGLE_CLIENT_ID: ${MAILBOX_GOOGLE_CLIENT_ID:-}
      MAILBOX_GOOGLE_CLIENT_SECRET: ${MAILBOX_GOOGLE_CLIENT_SECRET:-}
      MAILBOX_MICROSOFT_CLIENT_ID: ${MAILBOX_MICROSOFT_CLIENT_ID:-}
      MAILBOX_MICROSOFT_CLIENT_SECRET: ${MAILBOX_MICROSOFT_CLIENT_SECRET:-}
      MAILBOX_MICROSOFT_TENANT: ${MAILBOX_MICROSOFT_TENANT:-common}
      WORKFLOW_TARGET_WORLD: "@workflow/world-postgres"
      WORKFLOW_POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WORKFLOW_LOCAL_BASE_URL: http://127.0.0.1:4000
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "10"
    ports:
      - "${APP_PORT:-4000}:4000"

  cron:
    build:
      context: ./docker/cron
    container_name: customermates-cron
    depends_on:
      - app
    restart: unless-stopped
    environment:
      APP_INTERNAL_URL: http://app:4000
      CRON_SECRET: ${CRON_SECRET}

volumes:
  postgres-data:
