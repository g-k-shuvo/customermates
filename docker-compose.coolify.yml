services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_APP_4000
      - APP_MODE=self-hosted
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BASE_URL=${BASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - AUTOMATION_SCHEDULE_ENABLED=${AUTOMATION_SCHEDULE_ENABLED:-false}
      - WEBHOOK_ALLOW_PRIVATE_HOSTS=${WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
      - CLAMAV_HOST=${CLAMAV_HOST:-}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - STORAGE_QUOTA_MB=${STORAGE_QUOTA_MB:-}
      - MAILBOX_GOOGLE_CLIENT_ID=${MAILBOX_GOOGLE_CLIENT_ID:-}
      - MAILBOX_GOOGLE_CLIENT_SECRET=${MAILBOX_GOOGLE_CLIENT_SECRET:-}
      - MAILBOX_MICROSOFT_CLIENT_ID=${MAILBOX_MICROSOFT_CLIENT_ID:-}
      - MAILBOX_MICROSOFT_CLIENT_SECRET=${MAILBOX_MICROSOFT_CLIENT_SECRET:-}
      - MAILBOX_MICROSOFT_TENANT=${MAILBOX_MICROSOFT_TENANT:-common}
      - RESEND_OPERATOR_EMAIL=${RESEND_OPERATOR_EMAIL}
      - EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-resend}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_SMTP_SECURE=${EMAIL_SMTP_SECURE:-false}
      - MAILBOX_SECRET_KEY=${MAILBOX_SECRET_KEY}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT:-}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - STORAGE_REGION=${STORAGE_REGION:-}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - STORAGE_MAX_UPLOAD_MB=${STORAGE_MAX_UPLOAD_MB:-}
      - DOCUSIGN_INTEGRATION_KEY=${DOCUSIGN_INTEGRATION_KEY:-}
      - DOCUSIGN_USER_ID=${DOCUSIGN_USER_ID:-}
      - DOCUSIGN_PRIVATE_KEY=${DOCUSIGN_PRIVATE_KEY:-}
      - DOCUSIGN_CONNECT_HMAC_SECRET=${DOCUSIGN_CONNECT_HMAC_SECRET:-}
      - DOCUSIGN_AUTH_SERVER=${DOCUSIGN_AUTH_SERVER:-}
      - DOCUSIGN_ACCOUNT_ID=${DOCUSIGN_ACCOUNT_ID:-}
      - BRAND_NAME=${BRAND_NAME}
      - BRAND_SUPPORT_EMAIL=${BRAND_SUPPORT_EMAIL}
      - AUTH_SOCIAL_LOGIN_DISABLED=${AUTH_SOCIAL_LOGIN_DISABLED:-false}
      - MARKETING_CHROME_DISABLED=${MARKETING_CHROME_DISABLED:-false}
      - VENDOR_HELP_DISABLED=${VENDOR_HELP_DISABLED:-false}
      - WORKFLOW_TARGET_WORLD=@workflow/world-postgres
      - WORKFLOW_POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WORKFLOW_LOCAL_BASE_URL=http://127.0.0.1:4000
      - WORKFLOW_POSTGRES_WORKER_CONCURRENCY=10
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  cron:
    build:
      context: ./docker/cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - APP_INTERNAL_URL=http://app:4000
      - CRON_SECRET=${CRON_SECRET}

volumes:
  postgres-data:
